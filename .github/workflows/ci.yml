name: Synthetic rehearsal checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --group browser
      - run: uv run --locked python tools/build.py --check
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked python tools/build_preview.py
      - run: uv run --locked python tools/build_publication.py
      - run: git diff --exit-code -- bundle baseline preview pyproject.toml uv.lock .python-version
      - run: uv run --locked python tools/check_public_package.py
      - run: uv run --locked python tools/check_publication.py --expected-commit "$GITHUB_SHA" --require-clean
      - name: Locate runner-installed Google Chrome
        run: |
          chrome_path="$(command -v google-chrome)"
          test -x "$chrome_path"
          echo "BROWSER_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Check the preview in sandboxed Chrome
        run: uv run --locked --group browser python tests/browser_check.py
      - name: Check all walkthroughs and their assets in sandboxed Chrome
        run: uv run --locked --group browser python tests/publication_browser_check.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publication-candidate
          path: _site/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: fixture-execution-evidence
          path: output/
  reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: chris-page-gov/okf-explorer
          ref: cce6e68d95c2946bb425effbaab48fbf04281a09
          path: .ci/okf-explorer
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.13.4'
      - run: uv sync --locked
      - run: uv sync --locked --project .ci/okf-explorer
      - run: uv run --locked python tools/build.py --check
      - run: uv run --locked python tools/build_publication.py
      - run: uv run --locked python tools/check_current_consumer.py --explorer .ci/okf-explorer --output output/current-consumer
      - name: Install the exact pinned pnpm executable
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/pnpm/pnpm/releases/download/v10.34.7/pnpm-linux-x64 \
            --output "$RUNNER_TEMP/pnpm"
          echo '44af1568f2682877e43d8918c344d420e022c3d1cc88a11b0dba3e20f9261450  '"$RUNNER_TEMP/pnpm" | sha256sum --check
          chmod 0755 "$RUNNER_TEMP/pnpm"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/pnpm" --version)" = '10.34.7'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.13.1'
          cache: pnpm
          cache-dependency-path: .ci/okf-explorer/apps/okf-explorer/pnpm-lock.yaml
      - name: Install frozen Reader dependencies without lifecycle scripts
        working-directory: .ci/okf-explorer/apps/okf-explorer
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          npm_config_audit: 'false'
          npm_config_fund: 'false'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install only the canonical harness's pinned Chromium
        working-directory: .ci/okf-explorer/apps/okf-explorer
        timeout-minutes: 10
        run: pnpm exec playwright install chromium
      - name: Check all three bundle scopes in the actual Reader
        run: |
          for scope in core domain control; do
            pnpm --dir .ci/okf-explorer/apps/okf-explorer acceptance:bundle -- \
              --bundle-root "$GITHUB_WORKSPACE/_site" \
              --journeys "$GITHUB_WORKSPACE/_site/acceptance/$scope-journeys.json" \
              --output "$GITHUB_WORKSPACE/output/$scope-reader.json" --port 4323
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: reader-execution-evidence
          path: output/
  release-gate:
    if: always()
    needs: [fixture, reader]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every declared assurance plane
        env:
          FIXTURE_RESULT: ${{ needs.fixture.result }}
          READER_RESULT: ${{ needs.reader.result }}
        run: |
          test "$FIXTURE_RESULT" = success
          test "$READER_RESULT" = success
