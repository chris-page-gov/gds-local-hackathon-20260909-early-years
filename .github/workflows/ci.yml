name: Synthetic rehearsal checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.2"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --group browser
      - run: uv run --locked python tools/build.py --check
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked python tools/build_preview.py
      - run: git diff --exit-code -- bundle baseline preview pyproject.toml uv.lock .python-version
      - run: uv run --locked python tools/check_public_package.py
      - name: Locate runner-installed Google Chrome
        run: |
          chrome_path="$(command -v google-chrome)"
          test -x "$chrome_path"
          echo "BROWSER_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Check the preview in sandboxed Chrome
        run: uv run --locked --group browser python tests/browser_check.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: fixture-execution-evidence
          path: output/
